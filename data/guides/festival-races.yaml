# Festival races for the "Comece aqui" guide (ADR-0024): the wristband that unlocks each race and
# its restriction (class and car group), from guides4gamers (read 2026-11-25), plus the car the
# guide suggests. The guide renders one table per wristband with <festival-races unlock="…">.
#
# Races:
#   name, series (road | dirt | cross-country), unlock (wristband), class (absent when the source
#   gives none: any class), group (as the game writes it), cars (the first is the main
#   suggestion), why, checked (the day the owner saw the restriction in game). A race without
#   unlock (the source does not say) is kept here but shown in no table.
#   A car is an id, or {id, class, surface, pick, skip} to choose its tune box: class and surface
#   default to the race's (or the wristband's class when the race has none); pick and skip are
#   tune ids from data/generated/tunes/by-car/<car>.json.
# Groups: which catalogue cars enter (any of types, a country, a stock drivetrain or a model
#   pattern). "Total X" follows the Playlist rule (ADR-0009): every car type whose name has X,
#   or the stock drivetrain. `confirmed: false` = a guess from the name alone, to check in game.
# src/lib/guide-races.test.ts checks every suggested car against its race.

groups:
  Classic Rally Cars: { types: [Classic Rally] }
  'Country: Japan': { country: Japan }
  Eclectic Domestics: { types: [Eclectic Domestics] }
  Evo vs Impreza: { model: 'Lancer Evolution|Impreza', confirmed: false }
  Extreme Track Toys: { types: [Extreme Track Toys] }
  Heavy Hitters:
    { types: ["Pickups & 4x4's", Utility Heroes, Sports Utility Heroes], confirmed: false }
  Hypercars: { types: [Hypercars] }
  Modern Rally Cars: { types: [Modern Rally] }
  Modern Sports Cars: { types: [Modern Sports Cars] }
  Modern Super Saloons: { types: [Modern Super Saloons] }
  Modern Supercars: { types: [Modern Supercars] }
  Pickups & 4x4s: { types: ["Pickups & 4x4's"] }
  Rally Monsters: { types: [Rally Monsters] }
  Retro Rally Cars: { types: [Retro Rally] }
  Retro Sports Cars: { types: [Retro Sports Cars] }
  Sports Utility Heroes: { types: [Sports Utility Heroes] }
  Super GT: { types: [Super GT] }
  Super Hot Hatch Cars: { types: [Super Hot Hatch] }
  Total AWD: { drivetrain: AWD }
  Total Buggies & Offroad: { types: [Buggies, Offroad, Unlimited Buggies, Unlimited Offroad] }
  Total Muscle: { types: [Classic Muscle, Retro Muscle, Modern Muscle] }
  Total Rally: { types: [Classic Rally, Retro Rally, Modern Rally, Rally Monsters] }
  Total Sports Cars: { types: [Classic Sports Cars, Retro Sports Cars, Modern Sports Cars] }
  Total Supercars: { types: [Retro Supercars, Modern Supercars] }
  Track Life: { types: [Track Toys, Extreme Track Toys] }
  Track Toys: { types: [Track Toys] }
  Unlimited Buggies: { types: [Unlimited Buggies] }
  Unlimited Offroad: { types: [Unlimited Offroad] }

