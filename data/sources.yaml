  - id: fhstats
    name: FHStats (online meta list and Rivals statistics)
    kind: website
    url: https://fhstats.com
    fetcher: fhstats
    adapter: fhstats
    tabs:
      - { id: online, role: list, path: metacars/horizon-racing }
