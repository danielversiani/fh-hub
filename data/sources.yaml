# Source registry. Documentation for each source: docs/DATA_SOURCES.md
# Policy (credit, permission, removal): docs/adr/0010-politica-de-fontes.md
#
# permission:
#   not-required → official/factual data, published normally
#   granted      → tuner authorised publication
#   pending      → synced only into .cache/preview (never committed or published)
#   denied       → keep `active: false`
version: 1
sources:
  - id: forza-cars
    name: Forza Horizon 6 Car List (forza.net)
    kind: forza-official
    url: https://forza.net/fh6cars
    fetcher: forza-net
    adapter: forza-cars
    tabs:
      - { id: cars, role: catalog, path: fh6cars }
    permission: not-required
    active: true
    weight: 1
    notes: Official roster. Master car list (ADR-0006).

  - id: fandom-rarity
    name: Forza Wiki (Fandom) — car rarity
    kind: wiki
    url: https://forza.fandom.com
    fetcher: mediawiki
    adapter: fandom-rarity
    tabs:
      - { id: common, role: attributes, path: 'Category:Common (FH6)' }
      - { id: rare, role: attributes, path: 'Category:Rare (FH6)' }
      - { id: epic, role: attributes, path: 'Category:Epic (FH6)' }
      - { id: legendary, role: attributes, path: 'Category:Legendary (FH6)' }
      - { id: forza-edition, role: attributes, path: 'Category:Forza Edition (FH6)' }
    permission: not-required
    active: true
    weight: 0.9
    notes: Wiki content under CC BY-SA (attribution shown on the site). Only the rarity is used.

  - id: forza-playlist
    name: Forza Horizon 6 Festival Playlist (forza.net)
    kind: forza-official
    url: https://forza.net/fh6playlists
    fetcher: forza-net
    adapter: forza-playlist
    tabs:
      - { id: playlist, role: playlist, path: fh6playlists }
    permission: not-required
    active: true
    weight: 1
    notes: Official events, requirements and rewards since Series 1 (ADR-0009).

