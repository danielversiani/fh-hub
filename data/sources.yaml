# Source registry. Documentation for each source: docs/DATA_SOURCES.md
# Policy (credit, permission, removal): docs/adr/0016-fontes-publicas-com-opcao-de-saida.md
#
# permission:
#   not-required → official/factual data, published normally
#   granted      → tuner authorised publication
#   public       → public community source, published with credit (ADR-0016); a tuner who
#                  asks to leave goes to data/manual/opt-out.yaml, a whole sheet → denied
#   pending      → synced only into .cache/preview (never committed or published)
#   denied       → keep `active: false`
version: 1
sources:
  - id: forza-cars
    name: Forza Horizon 6 Car List (forza.net)
    kind: forza-official
    url: https://forza.net/fh6cars
    fetcher: forza-net
    adapter: forza-cars
    tabs:
      - { id: cars, role: catalog, path: fh6cars }
    permission: not-required
    active: true
    weight: 1
    notes: Official roster. Master car list (ADR-0006).

  - id: fandom-rarity
    name: Forza Wiki (Fandom) — car rarity
    kind: wiki
    url: https://forza.fandom.com
    fetcher: mediawiki
    adapter: fandom-rarity
    tabs:
      - { id: common, role: attributes, path: 'Category:Common (FH6)' }
      - { id: rare, role: attributes, path: 'Category:Rare (FH6)' }
      - { id: epic, role: attributes, path: 'Category:Epic (FH6)' }
      - { id: legendary, role: attributes, path: 'Category:Legendary (FH6)' }
      - { id: forza-edition, role: attributes, path: 'Category:Forza Edition (FH6)' }
    permission: not-required
    active: true
    weight: 0.9
    notes: Wiki content under CC BY-SA (attribution shown on the site). Only the rarity is used.

  - id: fandom-drivetrain
    name: Forza Wiki (Fandom) — stock drivetrain
    kind: wiki
    url: https://forza.fandom.com
    fetcher: mediawiki
    adapter: fandom-drivetrain
    tabs:
      - { id: fwd, role: attributes, path: 'Category:Front-Wheel Drive' }
      - { id: rwd, role: attributes, path: 'Category:Rear-Wheel Drive' }
      - { id: awd, role: attributes, path: 'Category:All-Wheel Drive' }
      # The drivetrain categories cover every Forza game: only cars also listed here are used.
      - { id: fh6, role: attributes, path: 'Category:Cars (FH6)' }
    permission: not-required
    active: true
    weight: 0.9
    notes: Wiki content under CC BY-SA (attribution shown on the site). Only the stock drivetrain is used.

  - id: fandom-images
    name: Forza Wiki (Fandom) — car photos
    kind: wiki
    url: https://forza.fandom.com
    fetcher: mediawiki-images
    adapter: fandom-images
    tabs:
      - { id: fh6, role: attributes, path: 'Category:Cars (FH6)' }
    permission: not-required
    active: true
    weight: 0.9
    notes: >-
      In-game screenshots (Microsoft's content, not CC BY-SA), used under Microsoft's Game Content
      Usage Rules with the required notice on the site (ADR-0013). Only the thumbnail URL is
      stored; the image is served by Fandom.

  - id: forza-playlist
    name: Forza Horizon 6 Festival Playlist (forza.net)
    kind: forza-official
    url: https://forza.net/fh6playlists
    fetcher: forza-net
    adapter: forza-playlist
    tabs:
      - { id: playlist, role: playlist, path: fh6playlists }
    permission: not-required
    active: true
    weight: 1
    notes: Official events, requirements and rewards since Series 1 (ADR-0009).

  - id: noa-miyako
    name: Noa Miyako (QQ Docs)
    kind: qq-doc
    url: https://docs.qq.com/sheet/DYWZVRWR0dnh3aHhZ
    docId: DYWZVRWR0dnh3aHhZ
    ownerTuner: Noa Miyako
    fetcher: qq-docs
    adapter: noa-miyako
    tabs:
      - { id: workbook, role: meta }
    permission: public
    active: true
    weight: 0.9
    notes: 'Sheet 地平线6线上车辆调校推荐. Meta tiers per class × surface. Undocumented QQ API (lib/qq-sheet.ts). No share codes.'

  - id: gbr-ozzy
    name: GBR Ozzy's FH6 Spreadsheet
