    active: true
    weight: 0.9
    notes: >-
      Online Racing meta list (curated from arpanjpr's sheet; tiers S+/S/A/B = Meta+/Meta/
      Strong/Offmeta, with tune codes) and Rivals leaderboard statistics read from the game
      screens (top-10/top-50 appearances, wins). Used under ADR-0016; authors can opt out.

