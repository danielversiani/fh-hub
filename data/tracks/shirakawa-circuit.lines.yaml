  - from: 1435
    to: 1615
    line: otimizado
    title:
      pt-br: Curva 5 (esquerda)
      en: Turn 5 (left)
    text:
      pt-br: "O otimizado não abre tudo na entrada: sacrifica um pouco esta curva para sair mais rápido para os 230 m até a próxima."
      en: "The fastest line does not swing fully wide on entry: it gives up a little here to exit faster onto the 230 m to the next one."
  - from: 1760
    to: 1920
    line: otimizado
    title:
      pt-br: Curva 6 (direita)
      en: Turn 6 (right)
    text:
      pt-br: "O otimizado não abre tudo na entrada: sacrifica um pouco esta curva para chegar bem posicionado na curva seguinte."
      en: "The fastest line does not swing fully wide on entry: it gives up a little here to be well placed for the next corner."
