    for:
      pt-br: Rascunho para revisão do dono. Pensada para carros de tração integral com boa aderência.
      en: Draft for the owner's review. Meant for all-wheel-drive cars with good grip.
    colors: ['#2fb7ff', '#3ee07a', '#c84cff', '#2fb7ff']
