notes:
  - from: 0
    to: 230
    line: ideal
    title: { pt-br: Reta → T1, en: Straight → T1 }
    text:
      pt-br: Venha para a esquerda antes do CP1 para entrar largo na T1.
      en: Move over to the left before CP1 to enter T1 wide.
  - from: 230
    to: 495
    line: ideal
    title: { pt-br: 'T1: ápice tardio', en: 'T1: late apex' }
    text:
      pt-br: Curva longa de 137°. Segure a entrada e toque a bandeira de dentro do CP2; depois deixe o carro abrir para a esquerda até o CP3.
      en: A long 137° bend. Hold the entry and touch the inside flag of CP2, then let the car run out to the left by CP3.
  - from: 680
    to: 1140
    line: ideal
    title: { pt-br: T2 e T3, en: T2 and T3 }
    text:
      pt-br: Duas direitas abertas. Use a pista toda em cada uma, com ápice por dentro, e saia aberto para preparar a próxima.
      en: Two open right-handers. Use the full width in each, apex on the inside, and exit wide to set up the next one.
  - from: 1440
    to: 1830
    line: ideal
    title: { pt-br: 'T4 → T5 → reta: sacrifique o grampo', en: 'T4 → T5 → straight: sacrifice the hairpin' }
    text:
      pt-br: É a sequência que mais pesa na volta. Na saída do grampo (T4), em vez de abrir à esquerda, segure o carro à direita. Assim a T5 fica por fora e com ápice tardio. Perde-se um pouco no grampo, mas sai-se mais rápido na reta principal, a maior da volta.
      en: The sequence that matters most on the lap. Out of the hairpin (T4), instead of running wide left, keep the car on the right. That gives a wide, late-apex T5. A little is lost in the hairpin, but the exit onto the main straight, the longest of the lap, is faster.
