# Irokawa Circuit: racing-line guide (ADR-0021). DRAFT by the Forza Paddock for the owner's
# review. Lateral position: −1 = car against the right edge, 0 = middle, +1 = against the left edge.
# Distances in metres from the line. The road's middle comes from the recorded lap and where it ran
# across the road (read from the video), so positions are approximate until the edges are recorded.
