# Irokawa Circuit: how the route looks (ADR-0021). Written from the owner's race video (lap 2 of
# 5). The HUD lap timer dates every frame exactly; the speedometer, integrated over the lap, gives
# 1,832 m against the 1,830 m measured by telemetry, so distances below are good to a few metres.
# Released by the owner as a work in progress in the Paddock Lab (2026-11-14).
published: true
references:
  - url: https://www.youtube.com/live/akn8HS0Q54c
    lapStart: '31:01'
# Lap 2 of the reference video, cut into a short clip served by the site, and where the car is
# at each second of it (metres along the lap; HUD lap clock and speedometer). Drives "Compare with
# video": the clip loops next to the model, and both move together.
lapVideo:
  src: /tracks/irokawa-circuit-road-race/volta.mp4
  sync: [[0, 0], [0.75, 41], [1.75, 96], [2.75, 154], [3.75, 212], [4.75, 260], [5.75, 300], [6.75, 336], [7.75, 373], [8.75, 413], [9.75, 457], [10.75, 504], [11.75, 555], [12.75, 609], [13.75, 666], [14.75, 725], [15.75, 784], [16.75, 841], [17.75, 899], [18.75, 956], [19.75, 1009], [20.75, 1057], [21.75, 1104], [22.75, 1153], [23.75, 1203], [24.75, 1258], [25.75, 1316], [26.75, 1377], [27.75, 1438], [28.75, 1486], [29.75, 1519], [30.75, 1545], [31.75, 1569], [32.75, 1596], [33.75, 1628], [34.75, 1665], [35.75, 1705], [36.75, 1746], [37.75, 1790], [38.65, 1830]]
road:
  width: 13
  surface: asphalt
  centerLine: none
  edgeLines: true
# The road is drawn level: the first camber reading mixed in the car's body roll (see the schema).
camber: flat
# Where the recorded lap ran across the road, on the racing lines' scale (+1 = car against the left
# edge, −1 = against the right edge, 0 = middle), read on 38 frames with a metre ruler drawn in
# perspective (car width as the scale). About ±0.2.
