ground: grass
foliage: autumn
sections:
  - from: 0
    width: 12.5
    note: start straight, Festival stands on both sides
    left: { edge: sidewalk, barrier: boards, scenery: [{ type: stands, offset: 2, density: 1, height: 9 }] }
    right: { edge: sidewalk, barrier: boards, scenery: [{ type: stands, offset: 2, density: 1, height: 9 }] }
  - from: 30
    note: stands on the left; on the right a paved strip up to a tall black fence, then trees
    left: { edge: sidewalk, barrier: boards, scenery: [{ type: stands, offset: 2, density: 1, height: 9 }, { type: banners, offset: 0.5, density: 0.4 }] }
    right: { edge: paved, edgeWidth: 4, barrier: fence, scenery: [{ type: trees, offset: 10, density: 0.6 }] }
  - from: 170
