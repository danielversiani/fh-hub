# Checkpoints (2 tall green flags each). Each one's passage time comes from the HUD's split-time
# change; the frame clock turns it into metres. The HUD's distance readouts agree within 1–3 m.
checkpoints:
  - { at: 240, note: before T1 }
  - { at: 387, note: T1 apex }
  - { at: 518, note: after T1 }
  - { at: 785, note: T2 apex, by the roofed stand }
  - { at: 1043, note: T3 exit }
  - { at: 1181, note: before the bridge }
  - { at: 1555, note: apex of the T4 hairpin }
  - { at: 1692, note: T5 }
  - { at: 0, note: the line (lap / finish) }
landmarks:
  - { at: 130, side: right, offset: 70, type: tower, size: 40, note: lattice tower by the start straight }
  - { at: 150, side: right, offset: 260, type: rocket, size: 70, note: the rocket on its launch tower (Irokawa Space Center) }
  - { at: 0, side: left, type: arch, note: Festival start arch (pink banner) }
  - { at: 70, side: left, type: truss, note: footbridge over the start straight }
  - { at: 800, side: left, offset: 70, type: tower, size: 45, note: lattice tower behind T2 (straight ahead from 555 m) }
  - { at: 1290, side: left, type: overpass, length: 30, note: the road dips under a bridge into the cutting }
  - { at: 1560, side: right, offset: 40, type: sphere, size: 26, note: second gas holder, inside the hairpin }
  - { at: 1772, side: left, type: truss, note: steel footbridge before the line }
