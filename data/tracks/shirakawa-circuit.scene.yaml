# Simplified model from the route picture (ADR-0023). Widths and scenery can be refined by hand.
published: false
road:
  width: 12
  surface: asphalt
  edgeLines: true
camber: flat
sections:
  - from: 0
    width: 12
# On the apex of T1–T4 and T7 (owner, 2026-11-21); the others are not placed yet.
checkpoints:
  - at: 274
    note: T1 apex
  - at: 579
    note: T2 apex
  - at: 858
    note: T3 apex
  - at: 1038
    note: T4 apex
  - at: 2045
    note: T7 apex
# Where the optimised line must pass (owner, 2026-11-21). Beyond ±1 = off the asphalt; 1.55 puts
# the car just outside the checkpoint's inner flag, over the grass.
linePins:
  - at: 274
    pos: -1.55
    note:
      pt-br: "Corte leve pela grama por dentro, passando por fora da bandeira do checkpoint, que fica em cima do ápice. Vale o mesmo para as curvas 2, 3 e 4."
      en: "A light cut over the inside grass, just outside the checkpoint's flag, which sits on the apex. Turns 2, 3 and 4 work the same way."
  - at: 579
    pos: 1.55
  - at: 858
    pos: 1.55
  - at: 1038
    pos: 1.55
    note:
      pt-br: "Da curva 4 até a 6 é quase uma reta só: as curvas são rápidas e só carros muito velozes e com pouca aderência precisam ajustar alguma coisa."
      en: "From turn 4 to turn 6 it is nearly one long straight; the bends are fast, and only very fast cars with little grip need to adjust."
  - at: 1770
    pos: 1.2
    note:
      pt-br: "Na preparação da curva 6, saia de leve da pista pela esquerda e atravesse a curva ainda pela esquerda. Só no meio do trecho até a curva 7 feche para a direita, chegando bem perto do muro."
      en: "To set up turn 6, run slightly off the track on the left and go through the corner still on the left. Only halfway to turn 7 close in to the right, right up to the wall."
  - at: 1860
    pos: 0.8
  - at: 1960
    pos: -1
  - at: 2045
    pos: 1.55
    note:
      pt-br: "Na curva 7, corte o checkpoint um pouco pela grama, por dentro."
      en: "At turn 7, cut the checkpoint a little over the inside grass."
  - at: 2600
    pos: -1
    note:
      pt-br: "Curva 8: entre pelo meio e abra até o fundo, pelo lado de fora. O ápice é bem tardio, já na saída, e daí o carro segue por dentro, pela esquerda, para passar a curva 9 quase reto até a chegada."
      en: "Turn 8: come in through the middle and run deep on the outside. The apex is very late, on the way out, and the car then stays on the inside, on the left, to take turn 9 almost straight to the finish."
  - at: 2645
    pos: 1
  - at: 2720
    pos: 0.9
